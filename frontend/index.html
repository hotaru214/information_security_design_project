<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恶意攻击行为溯源分析系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🛡</span>
      <div>
        <h1>恶意攻击行为溯源分析系统</h1>
        <p class="subtitle">基于主机日志、主机行为、网络流量的攻击溯源 · Event V2</p>
      </div>
    </div>
    <span id="mode-badge" class="mode-badge hidden">演示模式（后端未连接）</span>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab" data-tab="timeline">攻击时间线</button>
    <button class="tab" data-tab="chain">攻击链</button>
    <button class="tab" data-tab="report">分析报告</button>
  </nav>

  <main>
    <!-- ① Dashboard -->
    <section id="page-dashboard" class="page active">
      <div class="stat-cards" id="stat-cards"></div>
      <!-- 主机 chip 行：host_map 主机名优先，无映射显示 IP（契约回退规则），
           点击 chip 跳时间线按主机过滤 -->
      <div class="card host-chips-bar" id="host-chips"></div>
      <div class="chart-grid">
        <div class="card chart-card"><h3>event_type 分布（点击图例/扇区过滤）</h3><div id="chart-type" class="chart"></div></div>
        <div class="card chart-card"><h3>按小时聚合（正常深色 / 异常红色，点击柱子过滤）</h3><div id="chart-hourly" class="chart"></div></div>
        <div class="card chart-card"><h3>severity 分布（点击柱子过滤）</h3><div id="chart-severity" class="chart"></div></div>
      </div>
    </section>

    <!-- ② 攻击时间线 -->
    <section id="page-timeline" class="page">
      <div class="card toolbar">
        <label><input type="checkbox" id="filter-anomaly"> 仅看异常</label>
        <select id="filter-type"><option value="">全部 event_type</option></select>
        <select id="filter-severity"><option value="">全部 severity</option></select>
        <select id="filter-host"><option value="">全部主机</option></select>
        <label class="range-label">时间范围
          <input type="datetime-local" id="filter-start" step="60"> ~
          <input type="datetime-local" id="filter-end" step="60">
        </label>
        <button id="filter-clear" class="btn-ghost" title="清空全部过滤条件">清空</button>
        <span id="timeline-count" class="muted"></span>
      </div>
      <div class="card"><div id="timeline" class="timeline"></div></div>
    </section>

    <!-- ③ 攻击链 -->
    <section id="page-chain" class="page">
      <div class="chain-layout">
        <div class="card chart-card chain-graph"><h3>攻击链关系图</h3><div id="chain-graph" class="chart tall"></div></div>
        <div class="card chain-links"><h3>攻击步骤</h3><div id="chain-links"></div></div>
      </div>
    </section>

    <!-- ④ 分析报告 -->
    <section id="page-report" class="page">
      <div class="card report-head">
        <button id="btn-analyze" class="btn-primary">开始分析</button>
        <span class="muted">根据攻击链与证据事件自动生成溯源分析报告</span>
      </div>
      <div class="card"><div id="report" class="report"><p class="muted">点击"开始分析"生成报告。</p></div></div>
    </section>
  </main>

  <!-- 事件详情弹窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-box card">
      <div class="modal-head">
        <h3 id="modal-title">事件详情</h3>
        <button id="modal-close" class="btn-close">✕</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    恶意攻击行为溯源分析系统 · 网络空间安全课程设计 题3 · 成员F（前端可视化 + LLM 分析） · Event V2 FINAL 契约
  </footer>

  <!-- ECharts 5：优先本地 lib（断网可演示），加载失败自动回退 CDN -->
  <script src="lib/echarts.min.js"></script>
  <script>
    if (typeof echarts === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"><\/script>');
    }
  </script>
  <script src="js/api.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/chain.js"></script>
  <script src="js/report.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
